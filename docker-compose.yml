services:
  remnawave-subscription-page:
    hostname: remnawave-subscription-page
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - remnawave-network
    env_file:
      - .env
    ports:
      - '127.0.0.1:3010:3010'

networks:
    remnawave-network:
        name: remnawave-network
        driver: bridge
        external: true
